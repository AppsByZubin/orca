[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "0.1.0"
description = "ORCA - Options Risk & Candidate Analyzer: ML-ranked option-selling candidates with multi-leg trade tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=12.0",
    "apscheduler>=3.10",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
kite = ["kiteconnect>=5.0"]
parquet = ["pyarrow>=16.0", "s3fs>=2024.6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
orca = "orca.cli:app"

[tool.setuptools.packages.find]
include = ["orca*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
